name: xdcode feature request
description: Propose a change to xdcode
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues for the same request, then describe the use case and expected behavior.
        Use docs/xdcode.md for the supported delivery contract.
        For a proposed upstream feature transplant, identify the relevant source revision
        and follow UPSTREAM_UPGRADE.md at the repository root.

  - type: input
    id: area
    attributes:
      label: Which part of xdcode would change?
      description: For example CLI, local daemon, provider configuration, tools, MCP, skills, sessions or offline delivery.
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: What problem would this solve?
      description: Describe the current workflow and a concrete example, with sensitive information removed.
    validations:
      required: true
  - type: textarea
    id: feature
    attributes:
      label: What feature would you like to see?
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional information
      description: Is there anything else you think we should know?
