xdcode-state = { workspace = true }
xdcode-terminal-detection = { workspace = true }
xdcode-thread-store = { workspace = true }
xdcode-tools = { workspace = true }
xdcode-utils-absolute-path = { workspace = true }
xdcode-utils-audio = { workspace = true }
xdcode-utils-cache = { workspace = true }
xdcode-utils-git-discovery = { workspace = true }
xdcode-utils-image = { workspace = true }
xdcode-utils-home-dir = { workspace = true }
xdcode-utils-output-truncation = { workspace = true }
xdcode-utils-path = { workspace = true }
xdcode-utils-path-uri = { workspace = true }
xdcode-utils-plugins = { workspace = true }
xdcode-utils-pty = { workspace = true }
xdcode-utils-string = { workspace = true }
