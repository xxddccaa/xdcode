xdcode-code-mode = { workspace = true }
xdcode-connectors = { workspace = true }
xdcode-context-fragments = { workspace = true }
xdcode-config = { workspace = true }
xdcode-core-plugins = { workspace = true }
xdcode-diagnostics = { workspace = true }
xdcode-exec-server = { workspace = true }
xdcode-extension-api = { workspace = true }
xdcode-extension-items = { workspace = true }
xdcode-features = { workspace = true }
xdcode-feedback = { workspace = true }
xdcode-file-system = { workspace = true }
