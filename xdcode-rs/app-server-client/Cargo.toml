[package]
name = "xdcode-app-server-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "xdcode_app_server_client"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
xdcode-app-server = { workspace = true }
xdcode-app-server-protocol = { workspace = true }
xdcode-arg0 = { workspace = true }
xdcode-config = { workspace = true }
xdcode-core = { workspace = true }
xdcode-exec-server = { workspace = true }
xdcode-feedback = { workspace = true }
xdcode-protocol = { workspace = true }
xdcode-uds = { workspace = true }
xdcode-utils-absolute-path = { workspace = true }
xdcode-utils-rustls-provider = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt"] }
tokio-tungstenite = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
