[package]
edition.workspace = true
license.workspace = true
name = "xdcode-memories-extension"
version.workspace = true

[lib]
name = "xdcode_memories_extension"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
xdcode-core = { workspace = true }
xdcode-extension-api = { workspace = true }
xdcode-features = { workspace = true }
xdcode-otel = { workspace = true }
xdcode-protocol = { workspace = true }
xdcode-tools = { workspace = true }
xdcode-utils-absolute-path = { workspace = true }
xdcode-utils-output-truncation = { workspace = true }
xdcode-utils-template = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros"] }
