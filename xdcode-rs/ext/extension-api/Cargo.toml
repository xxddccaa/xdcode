[package]
edition.workspace = true
license.workspace = true
name = "xdcode-extension-api"
version.workspace = true

[lib]
name = "xdcode_extension_api"
path = "src/lib.rs"
test = false
doctest = false

[lints]
workspace = true

[dependencies]
xdcode-core-plugin-common = { workspace = true }
xdcode-api = { workspace = true }
futures = { workspace = true }
xdcode-guardian-context = { workspace = true }
xdcode-history = { workspace = true }
xdcode-config = { workspace = true }
xdcode-context-fragments = { workspace = true }
xdcode-exec-server-protocol = { workspace = true }
xdcode-file-system = { workspace = true }
xdcode-mcp = { workspace = true }
xdcode-protocol = { workspace = true }
xdcode-tools = { workspace = true }
xdcode-utils-absolute-path = { workspace = true }
xdcode-utils-path-uri = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
