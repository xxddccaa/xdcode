[package]
edition.workspace = true
license.workspace = true
name = "xdcode-agent-message-board-extension"
version.workspace = true

[lib]
name = "xdcode_agent_message_board_extension"
path = "src/lib.rs"
test = false
doctest = false

[lints]
workspace = true

[dependencies]
xdcode-agent-message-board-client = { workspace = true }
xdcode-config = { workspace = true }
xdcode-extension-api = { workspace = true }
xdcode-features = { workspace = true }
xdcode-http-client = { workspace = true }
xdcode-message-board = { workspace = true }
xdcode-message-board-mcp = { workspace = true }
xdcode-protocol = { workspace = true }
xdcode-state = { workspace = true }
xdcode-tools = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "rt-multi-thread"] }
