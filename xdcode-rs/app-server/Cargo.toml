xdcode-user-verification = { workspace = true }
xdcode-utils-pty = { workspace = true }
xdcode-backend-client = { workspace = true }
xdcode-file-search = { workspace = true }
xdcode-chatgpt = { workspace = true }
xdcode-login = { workspace = true }
xdcode-image-generation-extension = { workspace = true }
xdcode-memories-extension = { workspace = true }
xdcode-web-search-extension = { workspace = true }
xdcode-websocket-auth = { workspace = true }
