[package]
name = "xdcode-app-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "xdcode-app-server"
path = "src/main.rs"

[[bin]]
name = "xdcode-app-server-test-notify-capture"
path = "src/bin/notify_capture.rs"

[[bin]]
name = "exec-server"
path = "src/bin/exec_server.rs"

[lib]
name = "xdcode_app_server"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
xdcode-utils-process = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
axum = { workspace = true, default-features = false, features = [
    "http1",
    "json",
    "tokio",
    "ws",
] }
xdcode-analytics = { workspace = true }
xdcode-app-server-daemon = { workspace = true }
xdcode-agent-extension = { workspace = true }
xdcode-arg0 = { workspace = true }
xdcode-aws-auth = { workspace = true }
xdcode-cloud-config = { workspace = true }
xdcode-code-mode = { workspace = true }
xdcode-config = { workspace = true }
xdcode-network-proxy = { workspace = true }
xdcode-connectors = { workspace = true }
xdcode-core = { workspace = true }
xdcode-core-plugins = { workspace = true }
xdcode-diagnostics = { workspace = true }
xdcode-home = { workspace = true }
xdcode-exec-server = { workspace = true }
xdcode-extension-api = { workspace = true }
xdcode-external-agent-migration = { workspace = true }
xdcode-features = { workspace = true }
xdcode-multi-env-copy-file = { workspace = true }
xdcode-goal-extension = { workspace = true }
xdcode-git-attribution = { workspace = true }
xdcode-guardian-v2 = { workspace = true }
xdcode-git-utils = { workspace = true }
xdcode-file-watcher = { workspace = true }
xdcode-hooks = { workspace = true }
xdcode-history-notes-extension = { workspace = true }
xdcode-http-client = { workspace = true }
xdcode-otel = { workspace = true }
xdcode-plugin = { workspace = true }
xdcode-shell-command = { workspace = true }
