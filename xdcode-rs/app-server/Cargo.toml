xdcode-sandboxing = { workspace = true }
xdcode-state = { workspace = true }
xdcode-thread-store = { workspace = true }
xdcode-tools = { workspace = true }
xdcode-utils-absolute-path = { workspace = true }
xdcode-utils-json-to-toml = { workspace = true }
