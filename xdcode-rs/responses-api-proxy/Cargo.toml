[package]
name = "xdcode-responses-api-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "xdcode_responses_api_proxy"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "xdcode-responses-api-proxy"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true, features = ["derive"] }
xdcode-http-client = { workspace = true }
xdcode-process-hardening = { workspace = true }
ctor = { workspace = true }
http = { workspace = true }
libc = { workspace = true }
reqwest = { workspace = true, features = ["blocking", "json", "rustls-tls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tiny_http = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "net"] }
url = { workspace = true }
zeroize = { workspace = true, features = ["serde"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
tracing = { workspace = true }
tracing-test = { workspace = true, features = ["no-env-filter"] }
