[package]
edition.workspace = true
license.workspace = true
name = "xdcode-models-manager"
version.workspace = true

[lib]
doctest = false
name = "xdcode_models_manager"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
chrono = { workspace = true, features = ["serde"] }
xdcode-http-client = { workspace = true }
xdcode-login = { workspace = true }
xdcode-otel = { workspace = true }
xdcode-protocol = { workspace = true }
xdcode-prompts = { workspace = true }
xdcode-utils-output-truncation = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "sync", "time"] }
tracing = { workspace = true, features = ["log"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
