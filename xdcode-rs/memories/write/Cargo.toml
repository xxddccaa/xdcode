[package]
edition.workspace = true
license.workspace = true
name = "xdcode-memories-write"
version.workspace = true

[lib]
name = "xdcode_memories_write"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
xdcode-backend-client = { workspace = true }
xdcode-core = { workspace = true }
xdcode-config = { workspace = true }
xdcode-features = { workspace = true }
xdcode-git-utils = { workspace = true }
xdcode-login = { workspace = true }
xdcode-model-provider = { workspace = true }
xdcode-otel = { workspace = true }
xdcode-protocol = { workspace = true }
xdcode-rollout = { workspace = true }
xdcode-rollout-trace = { workspace = true }
xdcode-secrets = { workspace = true }
xdcode-state = { workspace = true }
xdcode-terminal-detection = { workspace = true }
xdcode-utils-absolute-path = { workspace = true }
xdcode-utils-output-truncation = { workspace = true }
xdcode-utils-template = { workspace = true }
futures = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "rt", "sync", "time"] }
tracing = { workspace = true, features = ["log"] }
uuid = { workspace = true, features = ["v4", "v5"] }

[dev-dependencies]
xdcode-model-provider-info = { workspace = true }
xdcode-models-manager = { workspace = true }
core_test_support = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros"] }
wiremock = { workspace = true }
