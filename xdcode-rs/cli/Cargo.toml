[package]
name = "xdcode-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"
default-run = "xdcode"

[[bin]]
name = "xdcode"
path = "src/main.rs"

[[bin]]
name = "logs_client"
path = "src/bin/logs_client.rs"

[[test]]
name = "app_server_daemon_package"
path = "tests/app_server_daemon/package.rs"

[lib]
name = "xdcode_cli"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
xdcode-utils-process = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
clap_complete = { workspace = true }
xdcode-app-server = { workspace = true }
xdcode-app-server-daemon = { workspace = true }
xdcode-app-server-protocol = { workspace = true }
xdcode-app-server-test-client = { workspace = true }
xdcode-arg0 = { workspace = true }
xdcode-build-info = { workspace = true }
xdcode-api = { workspace = true }
xdcode-aws-auth = { workspace = true }
xdcode-cloud-config = { workspace = true }
xdcode-utils-cli = { workspace = true }
xdcode-config = { workspace = true }
xdcode-core = { workspace = true }
xdcode-core-plugins = { workspace = true }
xdcode-history = { workspace = true }
xdcode-home = { workspace = true }
xdcode-http-client = { workspace = true }
xdcode-exec = { workspace = true }
xdcode-exec-server = { workspace = true }
xdcode-execpolicy = { workspace = true }
xdcode-extension-api = { workspace = true }
xdcode-features = { workspace = true }
xdcode-multi-env-copy-file = { workspace = true }
xdcode-git-attribution = { workspace = true }
xdcode-git-utils = { workspace = true }
xdcode-install-context = { workspace = true }
xdcode-login = { workspace = true }
xdcode-memories-write = { workspace = true }
xdcode-mcp = { workspace = true }
xdcode-model-provider = { workspace = true }
xdcode-models-manager = { workspace = true }
xdcode-plugin = { workspace = true }
xdcode-protocol = { workspace = true }
xdcode-responses-api-proxy = { workspace = true }
xdcode-tcp-tunnel = { workspace = true }
xdcode-rmcp-client = { workspace = true }
xdcode-rollout = { workspace = true }
xdcode-rollout-trace = { workspace = true }
xdcode-sandboxing = { workspace = true }
xdcode-skills-extension = { workspace = true }
xdcode-state = { workspace = true }
xdcode-stdio-to-uds = { workspace = true }
xdcode-terminal-detection = { workspace = true }
xdcode-thread-store = { workspace = true }
xdcode-tui = { workspace = true }
xdcode-utils-absolute-path = { workspace = true }
xdcode-utils-path = { workspace = true }
xdcode-utils-path-uri = { workspace = true }
xdcode-utils-redacted-string = { workspace = true }
xdcode-websocket-auth = { workspace = true }
crossterm = { workspace = true, features = ["event-stream"] }
futures = { workspace = true }
http = { workspace = true }
libc = { workspace = true }
libsqlite3-sys = { workspace = true }
os_info = { workspace = true }
owo-colors = { workspace = true }
regex-lite = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sqlx = { workspace = true }
supports-color = { workspace = true }
sys-locale = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "time",
] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
unicode-segmentation = { workspace = true }
url = { workspace = true }
which = { workspace = true }

[target.'cfg(all(target_os = "linux", target_env = "musl", any(target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
tikv-jemallocator = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
xdcode_windows_sandbox = { package = "xdcode-windows-sandbox", path = "../windows-sandbox-rs" }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Console",
    "Win32_System_Threading",
] }

[dev-dependencies]
app_test_support = { workspace = true }
assert_cmd = { workspace = true }
assert_matches = { workspace = true }
xdcode-app-server-client = { workspace = true }
xdcode-utils-cargo-bin = { workspace = true }
xdcode-utils-pty = { workspace = true }
core_test_support = { workspace = true }
flate2 = { workspace = true }
insta = { workspace = true }
jsonwebtoken = { workspace = true }
predicates = { workspace = true }
pretty_assertions = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }
tokio-tungstenite = { workspace = true }
vt100 = { workspace = true }
wiremock = { workspace = true }
zstd = { workspace = true }

[package.metadata.cargo-shear]
# These Rust sources are intentionally Bazel-only macrobenchmarks rather than
# Cargo targets.
ignored-paths = ["e2e_benches/*.rs"]
